<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
<title id="title">二人禅与非暴力沟通的分阶段整合</title><desc id="desc">先进行双人探寻，接着静默整合，再做NVC自我同理，最后才进入自愿的关系对话；中间保留清楚的阶段分隔。</desc>
